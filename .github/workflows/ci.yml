name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      # FFmpeg is needed by the integration tests (synthetic test videos only).
      - name: Install FFmpeg
        run: choco install ffmpeg innosetup --no-progress -y

      - name: Restore
        run: dotnet restore ALMARFELD.SubFlow.sln

      - name: Build (warnings are errors)
        run: dotnet build ALMARFELD.SubFlow.sln -c Release --no-restore

      - name: Test
        run: dotnet test ALMARFELD.SubFlow.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults

      - name: Package and verify clean distribution
        shell: pwsh
        run: |
          ./build/package.ps1 -SkipTests -RequireInstaller
          ./build/validate-package.ps1
